<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="title">Topology-aware ingestion and routing</title>
  <desc id="desc">A universal ingestion framework detects information topology and routes narrative, epistolary, dialogue, tables, code, and logs to specialized chunking strategies.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#1D4E5F"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#16181C"/>
    </marker>
  </defs>

  <rect width="900" height="900" fill="#FBFBF9"/>

  <!-- HEADER -->
  <text x="40" y="48" font-size="12" letter-spacing="2.4" fill="#6E747D">ROUTING MODEL</text>
  <text x="40" y="91" font-family="Georgia, serif" font-size="30" fill="#16181C">One ingestion framework.</text>
  <text x="40" y="127" font-family="Georgia, serif" font-size="30" fill="#16181C">Different structures take <tspan font-style="italic">different paths.</tspan></text>
  <line x1="40" y1="151" x2="860" y2="151" stroke="#C9CCD1"/>

  <!-- INGESTION -->
  <text x="450" y="183" text-anchor="middle" font-size="12" letter-spacing="2" fill="#6E747D">UNIVERSAL ENTRY POINT</text>
  <rect x="245" y="197" width="410" height="58" fill="#FFFFFF" stroke="#16181C" stroke-width="1.4"/>
  <text x="450" y="222" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16181C">Universal ingestion framework</text>
  <text x="450" y="242" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11.5" fill="#6E747D">ONE INTERFACE · MULTIPLE TOPOLOGIES</text>
  <line x1="450" y1="255" x2="450" y2="282" stroke="#16181C" stroke-width="1.4" marker-end="url(#arrowDark)"/>

  <!-- DETECTION -->
  <rect x="120" y="294" width="660" height="92" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.4"/>
  <text x="140" y="320" font-size="12" font-weight="700" letter-spacing="1.9" fill="#1D4E5F">CLASSIFICATION LAYER</text>
  <text x="140" y="352" font-family="Georgia, serif" font-size="21" fill="#16181C">Topology detection <tspan fill="#6E747D">&amp;</tspan> routing</text>
  <text x="140" y="374" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11.5" fill="#6E747D">IDENTIFY STRUCTURE BEFORE CHUNKING</text>
  <line x1="450" y1="386" x2="450" y2="416" stroke="#1D4E5F" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ROUTES -->
  <text x="40" y="443" font-size="12" letter-spacing="2" fill="#6E747D">TOPOLOGY-SPECIFIC ROUTES</text>
  <line x1="40" y1="454" x2="860" y2="454" stroke="#1D4E5F" stroke-width="2"/>

  <rect x="40" y="475" width="820" height="58" fill="#FFFFFF" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="510" font-family="Georgia, serif" font-size="18" fill="#16181C">Narrative</text>
  <line x1="225" y1="504" x2="287" y2="504" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="315" y="510" font-size="15" font-weight="600" fill="#1D4E5F">Hierarchical prose chunker</text>

  <rect x="40" y="546" width="820" height="58" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="581" font-family="Georgia, serif" font-size="18" fill="#16181C">Epistolary</text>
  <line x1="225" y1="575" x2="287" y2="575" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="315" y="581" font-size="15" font-weight="600" fill="#1D4E5F">Document-bound hierarchy</text>

  <rect x="40" y="617" width="820" height="58" fill="#FFFFFF" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="652" font-family="Georgia, serif" font-size="18" fill="#16181C">Dialogue</text>
  <line x1="225" y1="646" x2="287" y2="646" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="315" y="652" font-size="15" font-weight="600" fill="#1D4E5F">Temporal-window hierarchy</text>

  <rect x="40" y="688" width="390" height="72" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="718" font-family="Georgia, serif" font-size="18" fill="#16181C">Tables</text>
  <text x="60" y="743" font-size="14.5" font-weight="600" fill="#1D4E5F">Row- and entity-aware units</text>

  <rect x="470" y="688" width="390" height="72" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="490" y="718" font-family="Georgia, serif" font-size="18" fill="#16181C">Code</text>
  <text x="490" y="743" font-size="14.5" font-weight="600" fill="#1D4E5F">Symbol and function hierarchy</text>

  <rect x="245" y="779" width="410" height="66" fill="#FFFFFF" stroke="#16181C" stroke-width="1.4"/>
  <text x="265" y="807" font-family="Georgia, serif" font-size="18" fill="#16181C">Logs</text>
  <text x="265" y="831" font-size="14.5" font-weight="600" fill="#1D4E5F">Event and time windows</text>

  <!-- FOOTER -->
  <line x1="40" y1="866" x2="860" y2="866" stroke="#16181C"/>
  <text x="450" y="891" text-anchor="middle" font-family="Georgia, serif" font-size="15.5" fill="#16181C">Universal ingestion does not require universal chunking. <tspan font-style="italic">It requires routing.</tspan></text>
</svg>
