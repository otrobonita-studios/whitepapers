<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="title">Controlled RAG evaluation pipeline</title>
  <desc id="desc">A research pipeline comparing four chunkers while holding the corpus, embedding model, retrieval method, context assembly, and language model generation constant. RAG evaluation metrics are the dependent variables.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#1D4E5F"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1L9 5L0 9Z" fill="#16181C"/>
    </marker>
  </defs>

  <rect width="900" height="900" fill="#FBFBF9"/>

  <!-- HEADER -->
  <text x="40" y="48" font-size="12" letter-spacing="2.4" fill="#6E747D">EXPERIMENT DESIGN</text>
  <text x="40" y="91" font-family="Georgia, serif" font-size="30" fill="#16181C">One variable changes.</text>
  <text x="40" y="127" font-family="Georgia, serif" font-size="30" fill="#16181C">The rest of the pipeline <tspan font-style="italic">stays fixed.</tspan></text>
  <line x1="40" y1="151" x2="860" y2="151" stroke="#C9CCD1"/>

  <!-- INPUT -->
  <text x="450" y="183" text-anchor="middle" font-size="12" letter-spacing="2" fill="#6E747D">INPUT CORPUS</text>
  <rect x="245" y="197" width="410" height="58" fill="#FFFFFF" stroke="#16181C" stroke-width="1.4"/>
  <text x="450" y="222" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16181C">Twain · Apollo · mixed</text>
  <text x="450" y="242" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11.5" fill="#6E747D">SAME SOURCE SET PER COMPARISON</text>
  <line x1="450" y1="255" x2="450" y2="282" stroke="#16181C" stroke-width="1.4" marker-end="url(#arrowDark)"/>

  <!-- INDEPENDENT VARIABLE -->
  <rect x="120" y="294" width="660" height="104" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.4"/>
  <text x="140" y="320" font-size="12" font-weight="700" letter-spacing="1.9" fill="#1D4E5F">INDEPENDENT VARIABLE</text>
  <text x="140" y="351" font-family="Georgia, serif" font-size="20" fill="#16181C">Chunking strategy</text>

  <rect x="354" y="330" width="70" height="42" fill="#FFFFFF" stroke="#1D4E5F"/>
  <rect x="435" y="330" width="70" height="42" fill="#FFFFFF" stroke="#1D4E5F"/>
  <rect x="516" y="330" width="70" height="42" fill="#FFFFFF" stroke="#1D4E5F"/>
  <rect x="597" y="330" width="70" height="42" fill="#FFFFFF" stroke="#1D4E5F"/>
  <text x="389" y="357" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1D4E5F">A</text>
  <text x="470" y="357" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1D4E5F">B</text>
  <text x="551" y="357" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1D4E5F">C</text>
  <text x="632" y="357" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1D4E5F">D</text>
  <text x="140" y="382" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11.5" fill="#6E747D">ONLY THIS STAGE VARIES</text>

  <line x1="450" y1="398" x2="450" y2="426" stroke="#1D4E5F" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FIXED PIPELINE -->
  <text x="40" y="452" font-size="12" letter-spacing="2" fill="#6E747D">CONTROLLED PIPELINE</text>
  <line x1="40" y1="463" x2="860" y2="463" stroke="#1D4E5F" stroke-width="2"/>

  <rect x="40" y="482" width="820" height="68" fill="#FFFFFF" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="509" font-size="15" font-weight="600" fill="#1D4E5F">Embedding</text>
  <text x="60" y="532" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5" fill="#16181C">BGE-M3 · dense + sparse hybrid</text>
  <line x1="450" y1="550" x2="450" y2="575" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="586" width="820" height="68" fill="#FFFFFF" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="613" font-size="15" font-weight="600" fill="#1D4E5F">Retrieval</text>
  <text x="60" y="636" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5" fill="#16181C">top-k vector + lexical search</text>
  <line x1="450" y1="654" x2="450" y2="679" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="40" y="690" width="390" height="78" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="60" y="717" font-size="15" font-weight="600" fill="#1D4E5F">Context assembly</text>
  <text x="60" y="740" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.2" fill="#16181C">parent expansion</text>
  <text x="60" y="757" font-size="11.8" font-style="italic" fill="#6E747D">where applicable</text>

  <line x1="430" y1="729" x2="468" y2="729" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="480" y="690" width="380" height="78" fill="#EAEFF1" stroke="#1D4E5F" stroke-width="1.15"/>
  <text x="500" y="717" font-size="15" font-weight="600" fill="#1D4E5F">LLM generation</text>
  <text x="500" y="742" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.2" fill="#16181C">fixed model + fixed prompt</text>

  <line x1="670" y1="768" x2="670" y2="795" stroke="#1D4E5F" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- DEPENDENT VARIABLES -->
  <rect x="245" y="807" width="615" height="58" fill="#FFFFFF" stroke="#16181C" stroke-width="1.4"/>
  <text x="265" y="832" font-size="15" font-weight="600" fill="#16181C">RAG evaluation metrics</text>
  <text x="265" y="852" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11.5" fill="#6E747D">THE DEPENDENT VARIABLES</text>
  <path d="M40 807H218V865H40Z" fill="#1D4E5F"/>
  <text x="129" y="830" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">MEASURED</text>
  <text x="129" y="850" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">OUTCOME</text>

  <!-- FOOTER -->
  <text x="450" y="891" text-anchor="middle" font-family="Georgia, serif" font-size="15.5" fill="#16181C">Change the chunker. Hold the system constant. <tspan font-style="italic">Measure what moves.</tspan></text>
</svg>
